# config/locate_prior.yaml —— 页面定位**位置先验**（AGENTS.md §四）
#
# 唯一用途：**决定扫描顺序**，不作为结论。每个命中仍必须由本页页眉条 OCR 现场证实。
# 先验错了不会漏页：阶段 A/B 探不中 → probe_fallback（ring/两端全扫）→ 兜底阶梯
# （20%×bottom → 45%×top+bottom）照旧覆盖全部页。
#
# 数据来源（实测，page_base=0）：run/wide/wide10c/00_index/page_index.json 全 10 例
#   + run/wide/speed10b（同 10 例，无预探针臂，用于确认 top 几何也能命中的院区）
#   + run/wide/vx_vllm_cg（2 例，本轮对照批）
# 取的是 frontpage_title_pages / frontpage_continuation_pages / probe.anchor / pn_hit_page。
#
# 字段：
#   group: head = 首页在记录**开头**；tail = 首页在记录**末尾**
#   frontpage.candidates: 首页候选页，写成相对锚点。head 组 = 从页首往后数（0based 页号）；
#                         tail 组 = 从页尾往前数（1 = 最后一页 n-1，2 = 倒数第二 n-2）
#   frontpage.geometry: 该院区首页**标题**在页眉条的哪一段（top / bottom）
#   first_progress.offsets: 首程标题页相对**首页锚点**的页距（带符号；tail 组为负）
#   first_progress.geometry: 首程标题所在段
#   samples: 支撑这一行的例数（0 = 推断，须复核）
version: "2026-10-10"
page_base: 0
default:                       # 院区不在表里时用：不猜位置，只保留「两端各试」的老策略
  group: unknown
  frontpage: {candidates: [], geometry: top}
  first_progress: {offsets: [], geometry: top}

hospitals:
  # ---------- A 尾组：首页在记录后段，首程在首页**前** ----------
  奉化:
    group: tail
    frontpage:
      candidates: [1, 2]        # 008: 标题 n-1=89，续页 88；015: 标题 79=n-1，续页 78
      geometry: top
    first_progress:
      offsets: [-11]            # 008: 88→77；015: 78→67（两例都是 −11）
      geometry: top
    samples: 2
  长兴人民:
    group: tail
    frontpage:
      candidates: [2, 1]        # (13): 标题 73=n-2；(17): 标题 69=n-2
      geometry: top
    first_progress:
      offsets: [-13]            # (13): 72→59；(17): 68→55（两例都是 −13）
      geometry: top
    samples: 2
  安吉:
    group: tail
    frontpage:
      candidates: [2, 1]        # 09162565: 标题 54,55（n=56）；09220067: 标题 56,57（n=58）
      geometry: bottom          # ★ 页底页眉（实测 y≈0.85-0.89）：top 窄条结构上看不见标题
    first_progress:
      offsets: [-7]             # 09162565: 54→47；09220067: 56→49（两例都是 −7）
      geometry: bottom          # 首程页眉同样在页底（47/43 的 bottom 窄条命中）
    samples: 2

  # ---------- B 头组：首页在第 0-1 页，首程在首页**后** ----------
  桐乡二院:
    group: head
    frontpage:
      candidates: [0, 1]        # 00286042: 标题 0 / 续页 1；00335376: 标题 1 / 续页 0
      geometry: top             # 页 0 的 top 窄条含「住院病案首页」（speed10b 实测命中）
    first_progress:
      offsets: [6, 8]           # 00286042: 0→6；00335376: 0→8
      geometry: top             # ★ 页 8 的 top 窄条含「首次病程记录」；bottom 窄条**不含**（wide10c 实测 0 命中）
    samples: 2
  玉环第一:
    group: head
    frontpage:
      candidates: [0, 1]        # 201020: 标题 1 / 续页 0；207232: 标题 1 / 续页 0
      geometry: top
    first_progress:
      offsets: [4, 5]           # 201020: 0→4；207232: 0→5
      geometry: top
    samples: 2
